name: Package Read It

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/read-it-a2bc
      - main
    paths:
      - "ReadIt/**"
      - "ReadItCore/**"
      - ".github/workflows/read-it-package.yml"
  pull_request:
    paths:
      - "ReadIt/**"
      - "ReadItCore/**"
      - ".github/workflows/read-it-package.yml"

jobs:
  package:
    name: Build macOS .app zip
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Package Read It
        run: |
          chmod +x ReadIt/scripts/package.sh
          ./ReadIt/scripts/package.sh

      - name: Upload ReadIt.zip
        uses: actions/upload-artifact@v4
        with:
          name: ReadIt-macOS
          path: ReadIt/dist/ReadIt.zip
          if-no-files-found: error
          retention-days: 14
